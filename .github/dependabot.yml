version: 2
updates:
  # npm workspaces のルートを見れば apps/* と packages/* もまとめて追随する。
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # 型は実行する Node に合わせる (.nvmrc = 24)。先行させると Node 26 にしか
      # 無い API を書いても typecheck が通り、CI の実行時に初めて落ちる。
      # .nvmrc を上げるときは、この ignore もあわせて外す。
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      # 1.0.1 は <style> 内の複数行 CSS コメントを書くたびに 2 桁ずつ深く字下げし、
      # format:check が収束しない (withastro/prettier-plugin-astro#487)。
      # package.json で 1.0.0 に固定してあり、修正版が出たら固定とこの行を外す。
      - dependency-name: "prettier-plugin-astro"
        versions:
          - "1.0.1"
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      # typecheck は wrangler types で worker-configuration.d.ts を生成してから走る
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    # 画面の証跡を PR へ知らせるため (下の「証跡」ステップ)。
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # ブラウザ本体は 100MB 超。Playwright のバージョンが変わるまで使い回す。
      - name: Playwright のブラウザをキャッシュ
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Playwright のブラウザを入れる
        # キャッシュから戻したときも OS の依存ライブラリは入れ直す必要がある。
        run: npx playwright install --with-deps chromium

      # サーバ (両アプリの wrangler dev) の起動は playwright.config.ts が受け持つ。
      #
      # wrangler dev が E2E の途中で**プロセスごと落ちる**ことがある (#38)。原因は上流
      # cloudflare/workers-sdk#14926 — miniflare が workerd を立て直しても wrangler が
      # それに追随できず終了する。中身の無い `✘ [ERROR]` しか残らない。
      #
      # 一次の守りは playwright.config.ts の serve-with-restart (落ちたら立て直す)。
      # ここはその上限に達した場合の受け皿で、サーバが死んだときだけ 1 度やり直す。
      # テスト自体の失敗はやり直さない (揺れは Playwright の retries が受け持つ)。
      # **どちらも #38 を隠しているだけ**で、上流が直るまで原因は残る。
      - name: E2E (サーバが落ちたときだけやり直す)
        run: |
          set -o pipefail
          if npm run test:e2e 2>&1 | tee "$RUNNER_TEMP/e2e.log"; then exit 0; fi
          if ! grep -q "ECONNREFUSED" "$RUNNER_TEMP/e2e.log"; then
            echo "::error::E2E が落ちました (サーバの死亡ではなくテストの失敗です)"
            exit 1
          fi
          echo "::warning::wrangler dev が落ちたので E2E をやり直します (#38)"
          npm run test:e2e

      # 画面の証跡 (e2e/screenshots.spec.ts)。
      #
      # **web (本体) には PR プレビュー URL が出せない** — `p5stage-web` はライブ同期の
      # Durable Object (ADR 0017) を持ち、Cloudflare は DO を実装した Worker に
      # プレビュー URL を発行しない。触って確かめる道が無いので、代わりに同じ画面を
      # ここで撮って PR へ添える。
      #
      # **E2E が落ちても撮る** (`always`)。見た目が壊れているから落ちている、という
      # ときにこそ要る。撮影自体が失敗しても E2E の判定は変えない (`continue-on-error`) —
      # 証跡が無いことは、テストが通ったかどうかとは別の話。
      - name: 画面の証跡を撮る
        if: always()
        continue-on-error: true
        run: npm run shots

      # **Gyazo へ上げる。** GitHub は外部 URL の画像しか本文に描かないので、
      # artifact (zip) では「落として開く」手間が要る。**PR を開いたその場で見える**
      # ことが要点なので、リポジトリに画像をコミットしない前提のまま貼れる置き場を使う。
      #
      # トークンが無い環境 (fork からの PR・未設定のリポジトリ) では黙って何もしない。
      # 証跡は在れば助かるもので、無いことが CI を止める理由にはならない。
      - name: 画面の証跡を Gyazo へ上げる
        id: shots
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GYAZO_ACCESS_TOKEN: ${{ secrets.GYAZO_ACCESS_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$GYAZO_ACCESS_TOKEN" ]; then
            echo "::notice::GYAZO_ACCESS_TOKEN が未設定のため画面の証跡は共有しません"
            exit 0
          fi
          if [ ! -f e2e/shots/manifest.json ]; then
            echo "::warning::画面の証跡が撮れていません"
            exit 0
          fi

          # 何を撮ったかは spec 側が manifest.json に書く (対応表を二重に持たない)。
          : > shots.tsv
          while IFS=$'\t' read -r file caption; do
            [ -f "e2e/shots/$file" ] || continue
            url=$(curl -sS -X POST https://upload.gyazo.com/api/upload \
              -F "access_token=$GYAZO_ACCESS_TOKEN" \
              -F "imagedata=@e2e/shots/$file" \
              -F "title=p5stage PR #$PR_NUMBER — $caption" \
              | jq -r '.url // empty')
            if [ -z "$url" ]; then
              echo "::warning::$file を Gyazo へ上げられませんでした"
              continue
            fi
            printf '%s\t%s\n' "$caption" "$url" >> shots.tsv
          done < <(jq -r '.[] | [.file, .caption] | @tsv' e2e/shots/manifest.json)

          if [ ! -s shots.tsv ]; then
            echo "::warning::Gyazo へ上げられた証跡がありません"
          fi

      - name: 証跡を PR にコメント
        if: always() && github.event_name == 'pull_request' && hashFiles('shots.tsv') != ''
        uses: actions/github-script@v9
        with:
          script: |
            const { readFileSync } = require("node:fs");
            const shots = readFileSync("shots.tsv", "utf8")
              .split("\n")
              .filter(Boolean)
              .map((line) => {
                const [caption, url] = line.split("\t");
                return { caption, url };
              });
            if (shots.length === 0) return;

            const marker = "## 📸 画面の証跡";
            const body = [
              marker,
              "",
              ...shots.flatMap(({ caption, url }) => [
                `**${caption}**`,
                "",
                `![${caption}](${url})`,
                "",
              ]),
              "**web (本体) には PR プレビュー URL が出せない** (Durable Object を持つ Worker は Cloudflare がプレビュー URL を発行しない — ADR 0017 の申し送り)。触って確かめたいときは手元で `npm run dev`。",
              "",
              `commit: ${context.sha.slice(0, 7)}`,
            ].join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              (c) => c.user.type === "Bot" && c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: 失敗したときだけレポートを残す
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # サーバ (wrangler dev) が落ちると、Playwright 側には接続拒否しか残らない。
      # 落ちた理由は wrangler のログにしか出ないので、失敗時だけ持ち帰る。
      - name: 失敗したときだけ wrangler のログを残す
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: wrangler-logs
          path: ~/.config/.wrangler/logs/
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    name: deploy (cloudflare workers)
    # 実行が通らないものは出さない。E2E は「別オリジンで実行できる」の最後の砦。
    needs: [verify, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # Cloudflare 側の準備が済むまでは CI を落とさずスキップする。
      - name: Cloudflare の資格情報を確認
        id: guard
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID が未設定のためデプロイをスキップしました"
          fi

      - uses: actions/checkout@v7
        if: steps.guard.outputs.ready == 'true'
      - uses: actions/setup-node@v7
        if: steps.guard.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        if: steps.guard.outputs.ready == 'true'
      - run: npm run build
        if: steps.guard.outputs.ready == 'true'

      # 実行環境を先に出す。本体だけ先に上がると iframe の参照先が欠ける。
      - name: preview (別オリジン実行環境) をデプロイ
        if: steps.guard.outputs.ready == 'true'
        run: npx wrangler deploy
        working-directory: apps/preview

      # スキーマはコードより先に上げる。逆にすると、新しいコードが
      # まだ無いテーブルを引く時間帯ができる。適用済みの分は読み飛ばされる。
      #
      # API トークンに D1 の権限が無いと 7403 で落ちる。他の設定不足と同じく
      # デプロイ全体は止めず、警告にして「何が効いていないか」を残す
      # (D1 を使うのは認証まわりだけで、他の機能は影響を受けない)。
      - name: D1 のマイグレーションを適用
        if: steps.guard.outputs.ready == 'true'
        run: |
          if npx wrangler d1 migrations apply p5stage --remote; then
            exit 0
          fi
          echo "::warning::D1 のマイグレーションを適用できませんでした。CLOUDFLARE_API_TOKEN に Account / D1 / Edit の権限が要ります。付与するまで認証 (ログイン) は本番で動きません"
        working-directory: apps/web

      - name: web (本体) をデプロイ
        if: steps.guard.outputs.ready == 'true'
        run: npx wrangler deploy
        working-directory: apps/web

  preview-deploy:
    name: preview deploy (pull request)
    # E2E は待たない。落ちたときに実物を見て切り分けられるよう、
    # 確認用の URL は先に出す。
    needs: verify
    # fork からの PR にはシークレットが渡らないので同一リポジトリの PR に限る。
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # workers.dev のサブドメイン名 (例: example-account)。プレビュー URL の組み立てに使う。
      # 秘密ではない (公開 URL の一部) のでリポジトリ変数に置く。
      WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
    steps:
      # プレビュー URL は <alias>-<worker 名>.<subdomain>.workers.dev で決まる。
      # 先に両方の URL を確定させてから、互いのオリジンを var で上書きしてアップロードする。
      # そうしないと本体は本番の実行環境を指したままになり、実行 iframe が
      # frame-ancestors に弾かれて動かない (ADR 0007)。
      - name: プレビューの前提を確認して URL を決める
        id: guard
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID が未設定のためプレビューをスキップしました"
            exit 0
          fi
          if [ -z "$WORKERS_SUBDOMAIN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::リポジトリ変数 CLOUDFLARE_WORKERS_SUBDOMAIN が未設定のためプレビューをスキップしました"
            exit 0
          fi

          # エイリアスは PR 単位。commit ごとに URL が変わらないので PR コメントが陳腐化しない。
          alias="pr-${{ github.event.pull_request.number }}"
          {
            echo "ready=true"
            echo "alias=$alias"
            echo "web_url=https://$alias-p5stage-web.$WORKERS_SUBDOMAIN.workers.dev"
            echo "preview_url=https://$alias-p5stage-preview.$WORKERS_SUBDOMAIN.workers.dev"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.guard.outputs.ready == 'true'
      - uses: actions/setup-node@v7
        if: steps.guard.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        if: steps.guard.outputs.ready == 'true'
      - run: npm run build
        if: steps.guard.outputs.ready == 'true'

      # versions upload は本番トラフィックを切り替えず、確認用の URL だけを発行する。
      # --var で本番オリジンを PR プレビューのオリジンに差し替える (両 Worker とも
      # 変数はこれ 1 つだけなので、他の変数を落とす心配は無い)。
      - name: preview をバージョンアップロード
        if: steps.guard.outputs.ready == 'true'
        run: |
          # pipefail が無いと tee の成功でアップロードの失敗が隠れる。
          set -o pipefail
          npx wrangler versions upload \
            --preview-alias "${{ steps.guard.outputs.alias }}" \
            --var "PUBLIC_WEB_ORIGIN:${{ steps.guard.outputs.web_url }}" \
            2>&1 | tee upload.log
          grep -qF "${{ steps.guard.outputs.preview_url }}" upload.log \
            || echo "::warning::preview のプレビュー URL が出力に見当たりません (Cloudflare 側で Preview URLs が無効かもしれません)"
        working-directory: apps/preview
      # **web にプレビュー URL は出ない。** `p5stage-web` はライブ同期の Durable Object
      # (ADR 0017) を持ち、Cloudflare は DO を実装した Worker にプレビュー URL を
      # 発行しない (`preview_urls: true` を書いても出ない — プラットフォーム側の制約)。
      #
      # それでもアップロードは走らせる。**本番デプロイが壊れる予兆をここで拾う**のが
      # preview deploy を required に入れている理由で、URL が出るかどうかとは別。
      # 画面の確認は e2e ジョブが撮る証跡が受け持つ。
      #
      # 未適用の Durable Object migration があるときだけは落とさない (下の判定)。
      # この扱いを web 側にしか置かないのは、実行環境 (apps/preview) に状態を持たせない
      # 設計だから — あちらに DO が増えることは想定していない (ADR 0007)。
      - name: web をバージョンアップロード (プレビュー URL は出ない)
        id: web_upload
        if: steps.guard.outputs.ready == 'true'
        run: |
          set -o pipefail
          if npx wrangler versions upload \
            --preview-alias "${{ steps.guard.outputs.alias }}" \
            --var "PUBLIC_PREVIEW_ORIGIN:${{ steps.guard.outputs.preview_url }}" \
            2>&1 | tee upload.log
          then
            exit 0
          fi

          # Durable Object のライフサイクル変更 (クラスの作成・削除・改名) は
          # **versions upload では適用できない** (Cloudflare API の code 10211)。
          # 原子的な操作なので段階的ロールアウトに載らず、`wrangler deploy` でしか
          # 適用できない、というプラットフォーム側の制約。
          #
          # したがって**新しい DO を入れる PR は必ずここで落ちる**。落とし続けると
          # required check (ci-gate) が詰まって、その migration を適用する唯一の道
          # (main への deploy) に永久に辿り着けない。
          #
          # 見逃すのはこの 1 コードだけ。他の失敗は今までどおり止める — 本番デプロイが
          # 壊れる予兆をここで拾えるのが、preview deploy を required に含めている理由。
          if grep -q "10211" upload.log; then
            echo "pending_do_migration=true" >> "$GITHUB_OUTPUT"
            echo "::notice::未適用の Durable Object migration があるため web のバージョンを上げられません (main への deploy で適用されます)"
            exit 0
          fi
          exit 1
        working-directory: apps/web

      - name: プレビュー URL を PR にコメント
        if: steps.guard.outputs.ready == 'true'
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ steps.guard.outputs.preview_url }}
          PENDING_DO: ${{ steps.web_upload.outputs.pending_do_migration }}
        with:
          script: |
            const marker = "## 🚀 Preview Deployment";
            // **web の URL は出さない。** 出せないものを載せると、404 を踏んでから
            // 「壊れている」と読まれる。理由と、代わりに何を見ればよいかを書く。
            //
            // 未適用の DO migration は別の話 (アップロード自体が通らない)。
            // 触れずに黙ると、バージョンが上がっていないことに気付けない。
            const pending = process.env.PENDING_DO === "true";
            const body = [
              marker,
              "",
              `- preview (実行環境): ${process.env.PREVIEW_URL} — **開いても何も動きません**。本体の iframe から読まれる前提の実行環境で、直接開くとプレースホルダが出るだけ (要件 5.1 / ADR 0007)。上がったことの確認用`,
              "- web (本体): **プレビュー URL は出せません** — ライブ同期の Durable Object を持つ Worker には、Cloudflare がプレビュー URL を発行しないため ([制約](https://developers.cloudflare.com/workers/versions-and-deployments/preview-urls/#limitations) / ADR 0017 の申し送り)。画面は「📸 画面の証跡」のコメントで、動きは手元の `npm run dev` で確かめてください",
              ...(pending
                ? [
                    "",
                    "> [!NOTE]",
                    "> 未適用の Durable Object migration があるため、web のバージョンは上げられていません (`wrangler versions upload` では適用できない制約)。main へマージすると `wrangler deploy` が適用します。",
                  ]
                : []),
              "",
              "URL は PR 単位で固定。新しい commit を push すると同じ URL の中身が入れ替わる。",
              "",
              `commit: ${context.sha.slice(0, 7)}`,
            ].join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              (c) => c.user.type === "Bot" && c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # ruleset の required check はこの 1 本に集約する。deploy / preview-deploy は
  # 条件付きで skip されるので、個別に required にすると「実行されない PR」で
  # 永久 pending になり auto-merge が詰まる。
  ci-gate:
    name: ci-gate
    needs: [verify, e2e, deploy, preview-deploy]
    # 既定では前段が失敗するとこのジョブごと skip され、required check が報告されない
    # まま pending で止まる。always() で必ず走らせ、結果は自前で判定する。
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 前段ジョブがすべて success か skipped であることを確かめる
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -eu
          echo "$NEEDS_JSON"
          bad=$(printf '%s' "$NEEDS_JSON" \
            | jq -r 'to_entries[]
                     | select(.value.result != "success" and .value.result != "skipped")
                     | .key' \
            | tr '\n' ' ')
          if [ -n "${bad% }" ]; then
            echo "::error::前段ジョブが失敗またはキャンセルされました: ${bad}"
            exit 1
          fi
          echo "OK: 前段ジョブはすべて success または skipped"

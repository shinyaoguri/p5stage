name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      # typecheck は wrangler types で worker-configuration.d.ts を生成してから走る
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # ブラウザ本体は 100MB 超。Playwright のバージョンが変わるまで使い回す。
      - name: Playwright のブラウザをキャッシュ
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Playwright のブラウザを入れる
        # キャッシュから戻したときも OS の依存ライブラリは入れ直す必要がある。
        run: npx playwright install --with-deps chromium

      # サーバ (両アプリの wrangler dev) の起動は playwright.config.ts が受け持つ。
      #
      # wrangler dev が E2E の途中で**プロセスごと落ちる**ことがある (#38)。原因は上流
      # cloudflare/workers-sdk#14926 — miniflare が workerd を立て直しても wrangler が
      # それに追随できず終了する。中身の無い `✘ [ERROR]` しか残らない。
      #
      # 一次の守りは playwright.config.ts の serve-with-restart (落ちたら立て直す)。
      # ここはその上限に達した場合の受け皿で、サーバが死んだときだけ 1 度やり直す。
      # テスト自体の失敗はやり直さない (揺れは Playwright の retries が受け持つ)。
      # **どちらも #38 を隠しているだけ**で、上流が直るまで原因は残る。
      - name: E2E (サーバが落ちたときだけやり直す)
        run: |
          set -o pipefail
          if npm run test:e2e 2>&1 | tee "$RUNNER_TEMP/e2e.log"; then exit 0; fi
          if ! grep -q "ECONNREFUSED" "$RUNNER_TEMP/e2e.log"; then
            echo "::error::E2E が落ちました (サーバの死亡ではなくテストの失敗です)"
            exit 1
          fi
          echo "::warning::wrangler dev が落ちたので E2E をやり直します (#38)"
          npm run test:e2e

      - name: 失敗したときだけレポートを残す
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # サーバ (wrangler dev) が落ちると、Playwright 側には接続拒否しか残らない。
      # 落ちた理由は wrangler のログにしか出ないので、失敗時だけ持ち帰る。
      - name: 失敗したときだけ wrangler のログを残す
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wrangler-logs
          path: ~/.config/.wrangler/logs/
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    name: deploy (cloudflare workers)
    # 実行が通らないものは出さない。E2E は「別オリジンで実行できる」の最後の砦。
    needs: [verify, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # Cloudflare 側の準備が済むまでは CI を落とさずスキップする。
      - name: Cloudflare の資格情報を確認
        id: guard
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID が未設定のためデプロイをスキップしました"
          fi

      - uses: actions/checkout@v7
        if: steps.guard.outputs.ready == 'true'
      - uses: actions/setup-node@v7
        if: steps.guard.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        if: steps.guard.outputs.ready == 'true'
      - run: npm run build
        if: steps.guard.outputs.ready == 'true'

      # 実行環境を先に出す。本体だけ先に上がると iframe の参照先が欠ける。
      - name: preview (別オリジン実行環境) をデプロイ
        if: steps.guard.outputs.ready == 'true'
        run: npx wrangler deploy
        working-directory: apps/preview

      # スキーマはコードより先に上げる。逆にすると、新しいコードが
      # まだ無いテーブルを引く時間帯ができる。適用済みの分は読み飛ばされる。
      #
      # API トークンに D1 の権限が無いと 7403 で落ちる。他の設定不足と同じく
      # デプロイ全体は止めず、警告にして「何が効いていないか」を残す
      # (D1 を使うのは認証まわりだけで、他の機能は影響を受けない)。
      - name: D1 のマイグレーションを適用
        if: steps.guard.outputs.ready == 'true'
        run: |
          if npx wrangler d1 migrations apply p5stage --remote; then
            exit 0
          fi
          echo "::warning::D1 のマイグレーションを適用できませんでした。CLOUDFLARE_API_TOKEN に Account / D1 / Edit の権限が要ります。付与するまで認証 (ログイン) は本番で動きません"
        working-directory: apps/web

      - name: web (本体) をデプロイ
        if: steps.guard.outputs.ready == 'true'
        run: npx wrangler deploy
        working-directory: apps/web

  preview-deploy:
    name: preview deploy (pull request)
    # E2E は待たない。落ちたときに実物を見て切り分けられるよう、
    # 確認用の URL は先に出す。
    needs: verify
    # fork からの PR にはシークレットが渡らないので同一リポジトリの PR に限る。
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # workers.dev のサブドメイン名 (例: example-account)。プレビュー URL の組み立てに使う。
      # 秘密ではない (公開 URL の一部) のでリポジトリ変数に置く。
      WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
    steps:
      # プレビュー URL は <alias>-<worker 名>.<subdomain>.workers.dev で決まる。
      # 先に両方の URL を確定させてから、互いのオリジンを var で上書きしてアップロードする。
      # そうしないと本体は本番の実行環境を指したままになり、実行 iframe が
      # frame-ancestors に弾かれて動かない (ADR 0007)。
      - name: プレビューの前提を確認して URL を決める
        id: guard
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID が未設定のためプレビューをスキップしました"
            exit 0
          fi
          if [ -z "$WORKERS_SUBDOMAIN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::リポジトリ変数 CLOUDFLARE_WORKERS_SUBDOMAIN が未設定のためプレビューをスキップしました"
            exit 0
          fi

          # エイリアスは PR 単位。commit ごとに URL が変わらないので PR コメントが陳腐化しない。
          alias="pr-${{ github.event.pull_request.number }}"
          {
            echo "ready=true"
            echo "alias=$alias"
            echo "web_url=https://$alias-p5stage-web.$WORKERS_SUBDOMAIN.workers.dev"
            echo "preview_url=https://$alias-p5stage-preview.$WORKERS_SUBDOMAIN.workers.dev"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.guard.outputs.ready == 'true'
      - uses: actions/setup-node@v7
        if: steps.guard.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        if: steps.guard.outputs.ready == 'true'
      - run: npm run build
        if: steps.guard.outputs.ready == 'true'

      # versions upload は本番トラフィックを切り替えず、確認用の URL だけを発行する。
      # --var で本番オリジンを PR プレビューのオリジンに差し替える (両 Worker とも
      # 変数はこれ 1 つだけなので、他の変数を落とす心配は無い)。
      - name: preview をバージョンアップロード
        if: steps.guard.outputs.ready == 'true'
        run: |
          # pipefail が無いと tee の成功でアップロードの失敗が隠れる。
          set -o pipefail
          npx wrangler versions upload \
            --preview-alias "${{ steps.guard.outputs.alias }}" \
            --var "PUBLIC_WEB_ORIGIN:${{ steps.guard.outputs.web_url }}" \
            2>&1 | tee upload.log
          grep -qF "${{ steps.guard.outputs.preview_url }}" upload.log \
            || echo "::warning::preview のプレビュー URL が出力に見当たりません (Cloudflare 側で Preview URLs が無効かもしれません)"
        working-directory: apps/preview
      - name: web をバージョンアップロード
        if: steps.guard.outputs.ready == 'true'
        run: |
          set -o pipefail
          npx wrangler versions upload \
            --preview-alias "${{ steps.guard.outputs.alias }}" \
            --var "PUBLIC_PREVIEW_ORIGIN:${{ steps.guard.outputs.preview_url }}" \
            2>&1 | tee upload.log
          grep -qF "${{ steps.guard.outputs.web_url }}" upload.log \
            || echo "::warning::web のプレビュー URL が出力に見当たりません (Cloudflare 側で Preview URLs が無効かもしれません)"
        working-directory: apps/web

      - name: プレビュー URL を PR にコメント
        if: steps.guard.outputs.ready == 'true'
        uses: actions/github-script@v9
        env:
          WEB_URL: ${{ steps.guard.outputs.web_url }}
          PREVIEW_URL: ${{ steps.guard.outputs.preview_url }}
        with:
          script: |
            const marker = "## 🚀 Preview Deployment";
            const body = [
              marker,
              "",
              `- web (本体): ${process.env.WEB_URL}`,
              `- preview (実行環境): ${process.env.PREVIEW_URL}`,
              "",
              "URL は PR 単位で固定。新しい commit を push すると同じ URL の中身が入れ替わる。",
              "",
              `commit: ${context.sha.slice(0, 7)}`,
            ].join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              (c) => c.user.type === "Bot" && c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # ruleset の required check はこの 1 本に集約する。deploy / preview-deploy は
  # 条件付きで skip されるので、個別に required にすると「実行されない PR」で
  # 永久 pending になり auto-merge が詰まる。
  ci-gate:
    name: ci-gate
    needs: [verify, e2e, deploy, preview-deploy]
    # 既定では前段が失敗するとこのジョブごと skip され、required check が報告されない
    # まま pending で止まる。always() で必ず走らせ、結果は自前で判定する。
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 前段ジョブがすべて success か skipped であることを確かめる
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -eu
          echo "$NEEDS_JSON"
          bad=$(printf '%s' "$NEEDS_JSON" \
            | jq -r 'to_entries[]
                     | select(.value.result != "success" and .value.result != "skipped")
                     | .key' \
            | tr '\n' ' ')
          if [ -n "${bad% }" ]; then
            echo "::error::前段ジョブが失敗またはキャンセルされました: ${bad}"
            exit 1
          fi
          echo "OK: 前段ジョブはすべて success または skipped"
